<style>
  :root {
    --bg:#f6f7f4; --surface:#ffffff; --ink:#1c2420; --ink-muted:#566058;

  .eyebrow { font-family:ui-monospace,monospace; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin-bottom:10px; }

  a.doc { display:block; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:12px; text-decoration:none; color:var(--ink); }
  a.doc b { display:block; font-size:1.05rem; margin-bottom:4px; }
  a.doc span { color:var(--ink-muted); font-size:14px; }
  a.doc:hover { border-color:var(--accent); }
</style>
</head>
